<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단어 암기 카드</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 1. 앱 시작 오버레이 레이어 -->
  <div id="start-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:9999;">
    <button onclick="initApp()" style="padding:20px 36px; font-size:22px; font-weight:bold; background:#4CAF50; color:white; border:none; border-radius:12px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.3);">
      🎧 클릭해서 학습 시작하기
    </button>
  </div>

  <div class="card-container">

    <!-- 2. 단어 카드 (클릭 시 뒤집힘) -->
    <div class="word-card" onclick="flipCard()">
      <div class="word-card-inner">
        
        <!-- 카드 앞면 (단어 & 병음) -->
        <div id="front" class="front">
          <div id="word" class="word"></div>
          <div id="pinyin" class="pinyin"></div>
          <!-- 발음 횟수 및 단계 표시 -->
          <div id="speak-count" class="speak-count"></div>      
        </div>

        <!-- 카드 뒷면 (뜻 & 예문) -->
        <div id="back" class="back">
          <div id="meaning" class="meaning"></div>
          <div id="example" class="example"></div>
          <div id="example_pinyin" class="example_pinyin"></div>
          <div class="progress-bar">
            <div class="progress-fill-back"></div>
          </div>      
        </div>

      </div>
    </div>
   
    <!-- 3. 컨트롤 및 버튼 영역 -->
    <div class="controls">
      <button id="prev" onclick="playManual('prev')">◀ 이전</button>
      <span id="counter">0 / 0</span>
      <button id="next" onclick="playManual('next')">다음 ▶</button>
      
      <!-- 아는 단어 제외 버튼 -->
      <button onclick="markAsKnown()" style="background-color: #4CAF50; color: white;">✅ 아는 단어</button>
      <span id="step-status" style="font-size: 0.9em; font-weight: bold; color: #2196F3; margin-left: 5px;"></span>
      
      <!-- 자동 재생 제어 -->
      <button id="btn-start" onclick="startAuto()">Start</button>
      <button id="btn-stop" onclick="stopAuto()">Stop</button>
      
      <!-- CSV 불러오기 및 메인 이동 -->
      <input type="file" id="csvFileInput" accept=".csv" style="display: none;" onchange="loadCSVFile(event)">
      <button onclick="document.getElementById('csvFileInput').click()">📥 CSV 불러오기</button>
      <button onclick="location.href='../hanyuyuedu/yuedumain.html'">🏠 메인으로</button>
    </div>

    <!-- 상태 메시지 출력 -->
    <div id="status" class="status"></div>
  </div>

  <!-- 4. 자바스크립트 스크립트 로드 (의존성 순서 준수) -->
 <script src="dict.js"></script>
  <script src="data.js"></script>
  <script src="highlight.js"></script>
  <script src="card.js"></script>
  <script src="speak.js"></script>
  <script src="auto.js"></script>
  <script src="main.js"></script>
 <!--<script src="js/app.js"></script>-->
</body>
</html>
